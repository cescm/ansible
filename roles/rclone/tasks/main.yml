---
## rclone role — Movistar WebDAV mount stack (synced with live state on trastero01)
## Chain: rclone mount movistar_webdav_enc (crypt) -> webdav (o2cloud-gateway :8088/dav/encrypted) -> Movistar micloud
## Monitoring: --rc --rc-addr 127.0.0.1:5572 + rclone-rc-to-prometheus.sh (timer 30s) -> textfile -> node-exporter -> Prometheus -> Grafana

- name: Create rclone mount directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/movistar_webdav
    - /mnt/movistar_webdav_cache

- name: Create rclone config directory
  file:
    path: /root/.config/rclone
    state: directory
    mode: '0700'

- name: Deploy rclone config from vault
  copy:
    content: "{{ rclone_config_content }}"
    dest: /root/.config/rclone/rclone.conf
    mode: '0600'
  when: rclone_config_content is defined

- name: Deploy rclone healthcheck script (webdav)
  copy:
    src: rclone-healthcheck.sh
    dest: /usr/local/bin/rclone-healthcheck.sh
    mode: '0755'

- name: Deploy rclone cache-clean script (ExecStartPre)
  copy:
    src: rclone-cache-clean.sh
    dest: /usr/local/bin/rclone-cache-clean.sh
    mode: '0755'

- name: Deploy rclone RC-to-textfile exporter script
  copy:
    src: rclone-rc-to-prometheus.sh
    dest: /usr/local/bin/rclone-rc-to-prometheus.sh
    mode: '0755'

- name: Deploy rclone-movistar-webdav systemd unit (mount)
  template:
    src: rclone-movistar-webdav.service.j2
    dest: /etc/systemd/system/rclone-movistar-webdav.service
    mode: '0644'
  notify: reload systemd

- name: Deploy rclone RC exporter service (oneshot)
  template:
    src: rclone-rc-exporter.service.j2
    dest: /etc/systemd/system/rclone-rc-exporter.service
    mode: '0644'
  notify: reload systemd

- name: Deploy rclone RC exporter timer (30s)
  template:
    src: rclone-rc-exporter.timer.j2
    dest: /etc/systemd/system/rclone-rc-exporter.timer
    mode: '0644'
  notify: reload systemd

- name: Deploy rclone-healthcheck service (oneshot)
  template:
    src: rclone-healthcheck.service.j2
    dest: /etc/systemd/system/rclone-healthcheck.service
    mode: '0644'
  notify: reload systemd

- name: Deploy rclone-healthcheck timer
  template:
    src: rclone-healthcheck.timer.j2
    dest: /etc/systemd/system/rclone-healthcheck.timer
    mode: '0644'
  notify: reload systemd

- name: Deploy jellyfin watchdog script
  copy:
    src: jellyfin-watchdog.sh
    dest: /usr/local/bin/jellyfin-watchdog.sh
    mode: '0755'

- name: Deploy jellyfin watchdog systemd unit
  template:
    src: jellyfin-watchdog.service.j2
    dest: /etc/systemd/system/jellyfin-watchdog.service
    mode: '0644'
  notify: reload systemd

- name: Deploy jellyfin watchdog timer
  template:
    src: jellyfin-watchdog.timer.j2
    dest: /etc/systemd/system/jellyfin-watchdog.timer
    mode: '0644'
  notify: reload systemd

- name: Stat rclone config
  stat:
    path: /root/.config/rclone/rclone.conf
  register: rclone_config

- name: Enable rclone services on boot
  systemd:
    name: "{{ item }}"
    enabled: yes
    daemon_reload: yes
  loop:
    - rclone-movistar-webdav.service
    - rclone-healthcheck.timer
    - rclone-rc-exporter.timer
    - jellyfin-watchdog.timer
  when: rclone_config.stat.exists

- name: Start rclone services
  systemd:
    name: "{{ item }}"
    state: started
    daemon_reload: yes
  loop:
    - rclone-movistar-webdav.service
    - rclone-healthcheck.timer
    - rclone-rc-exporter.timer
    - jellyfin-watchdog.timer
  when: rclone_config.stat.exists
