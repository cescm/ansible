---
- name: Create /mnt/scripts directory
  file:
    path: /mnt/scripts
    state: directory
    mode: '0755'

- name: Create /mnt/scripts/infra directory
  file:
    path: /mnt/scripts/infra
    state: directory
    mode: '0755'

- name: Deploy retry-vm.sh (templated with OCI config)
  template:
    src: templates/retry-vm.sh.j2
    dest: /mnt/scripts/infra/retry-vm.sh
    mode: '0755'
  when: oci_tenancy_ocid is defined

- name: Deploy custom scripts (preserving functional subfolders)
  copy:
    src: files/
    dest: /mnt/scripts/
    mode: '0755'
    directory_mode: '0755'
