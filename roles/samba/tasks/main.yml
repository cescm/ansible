---
- name: Install Samba
  apt:
    name: samba
    state: present

- name: Deploy smb.conf from vault
  copy:
    content: "{{ smb_conf_content }}"
    dest: /etc/samba/smb.conf
    mode: '0644'
  when: smb_conf_content is defined and smb_conf_content | length > 0
  notify: restart smbd

- name: Start and enable smbd
  systemd:
    name: smbd
    state: started
    enabled: yes

- name: Start and enable nmbd
  systemd:
    name: nmbd
    state: started
    enabled: yes

- name: Ensure cescm system user exists
  user:
    name: cescm
    state: present
    shell: /bin/bash
    create_home: yes

- name: Set Samba password for cescm
  shell: >
    printf '%s\n%s\n' "{{ samba_cescm_password }}" "{{ samba_cescm_password }}" | smbpasswd -a -s cescm
  when: samba_cescm_password is defined
  no_log: true
